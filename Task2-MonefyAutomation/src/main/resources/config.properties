# Static, non-secret facts only - never selection decisions, never secrets,
# never per-build values (like app paths). Platform, device choice,
# environment choice, and app choice are CI/TestNG-supplied parameters,
# not stored here.

# --- Device facts, keyed by platform.deviceKey ---
# The KEY (e.g. "samsung") is chosen by CI/TestNG at runtime.
# This file only defines what that key actually is.

#devices.android.pixel.name=sdk_gphone16k_x86_64
#devices.android.pixel.version=15

#devices.android.pixel8.name=Google Pixel 8
#devices.android.pixel8.version=14.0

devices.android.pixel7.name=Google Pixel 7
devices.android.pixel7.version=13.0

devices.android.samsung.name=Samsung Galaxy S24
devices.android.samsung.version=16.0

devices.ios.iphone15.name=iPhone 15
devices.ios.iphone15.version=18

# --- Endpoint facts, keyed by environment name ---
# The environment name (e.g. "saucelabs") is chosen by CI/TestNG at runtime.
# This file only defines what URL that name actually points to.
endpoints.local.url=http://127.0.0.1:4723
endpoints.saucelabs.url=https://ondemand.eu-central-1.saucelabs.com:443/wd/hub
endpoints.browserstack.url=https://hub-cloud.browserstack.com/wd/hub